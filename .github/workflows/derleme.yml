# Otomatik derleme ve test: Windows x64 (W2-depo §5; 09 §2.8).
#
# İçerik (iki iş akışında aynı): host derleme (uyarı hatadır), birim testi, sözleşme
# başlıkları denetimi, çekirdek sınırı (derleme sonrası başlık bağımlılıkları dahil), kartsız
# firmware derlemesi (harita, boyut ve yığın raporu artefakt), bellek ayırma denetimi,
# sanitizer (host-asan), statik analiz ve kendi testi. Belge ve depo denetimi belge.yml'dedir.
#
# Koşuların ilişkisi (sol S4; GitHub eşzamanlılık kuralları iş akışı düzeyinde uygulanır):
#   - derleme.yml (Windows): PR açılınca, her yeni gönderimde, yeniden açılınca ve elle
#     (workflow_dispatch). Etiket olayları bu iş akışını hiç tetiklemez; bu yüzden etiket
#     eklemek Windows koşusunu iptal edemez. Grup: derleme-windows-<dal>; aynı dalda yeni
#     gönderim ya da elle başlatma, süren Windows koşusunu iptal eder.
#   - derleme-mac.yml (macOS): `ci-mac` etiketi EKLENDİĞİNDE ve elle. Bu iş akışı yeni
#     gönderimde de tetiklenir ama işi atlanır (koşucu dakikası harcanmaz): amacı yalnız
#     eşzamanlılık grubuna girerek aynı dalın süren macOS koşusunu iptal etmektir.
#     Grup: derleme-mac-<dal>-ana. `ci-mac` dışındaki bir etiketin eklenmesi ayrı bir gruba
#     düşer (derleme-mac-<dal>-etiket-<ad>), süren macOS koşusunu iptal etmez.
#   - <dal>: PR olaylarında PR'ın kaynak dalı (github.head_ref), elle başlatmada seçilen dal
#     (github.ref_name). Yani aynı dalın PR koşuları ile elle başlatılan koşuları aynı
#     gruptadır: hangisi sonra gelirse öncekini iptal eder.
#   - Sınır: yalnız belge değiştiren gönderim iki derleme iş akışını da tetiklemez
#     (paths; docs/sozlesmeler/sema/** hariç); böyle bir gönderim süren macOS koşusunu iptal etmez (derlenen kod
#     değişmemiştir).
#   - workflow_dispatch yalnız dosya varsayılan dalda (main) bulunduktan sonra kullanılabilir;
#     bu dosyaları getiren ilk PR'da macOS işinin tek yolu `ci-mac` etiketidir. Kayıt agent'ı
#     birleştirmeden önce etiketi bir kez ekler. Gerekçe: her iş Mac'te yerelde derlenip test
#     edilir; macOS dakikası Windows'unkinin yaklaşık altı katıdır.
#
# İş yapısı (2026-11-24 ölçümü: tek iş 60 dakikayı aştı; host-asan tek başına 30-40 dk):
# Windows iki paralel işe bölünmüştür; ikisi de aynı iş tanımının matris kollarıdır, kurulum
# adımları (Python, MSVC ortamı, önbellek yolları, vcpkg ikili önbelleğini geri yükleme, vcpkg
# hazırlığı, sürümler) tek yerde durur.
#   - `Windows x64` (asan=false): host-debug (+ MSVC /analyze), vcpkg ikili önbelleğini kaydet,
#     fw-debug, fw-release, statik analiz ve kendi testi, rapor. Arm GNU, cppcheck ve clang-tidy
#     yalnız bu kolda kurulur. host-debug testleri sırayla koşar (zamanlama ölçütleri burada).
#   - `Windows x64 (ASan)` (asan=true): yalnız host-asan (yapılandırma, derleme, test). Testler
#     `ctest -j 2` ile koşar (koşucu 4 sanal çekirdek). vcpkg ikili önbelleğini yalnız geri
#     yükler, kaydetmez: aynı anahtarı iki iş birden kaydetmeye çalışıp çakışmasın.
# Her işin süre sınırı ayrı ayrı 60 dakikadır; eşzamanlılık grubu iş akışı düzeyindedir.
# Matris: https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs
#
# Kota: depo özeldir ve GitHub Free planındadır (aylık 12 USD dahil kullanım; dakika ücreti
# Linux 0,006, Windows 0,010, macOS 0,062 USD). Windows iki paralel iştir (iş
# başına dakika yukarı yuvarlanır; toplam dakika tek işe göre biraz artar) ve araçlar önbelleklenir. Koşucu etiketleri açık
# sürümlüdür; eylemler commit SHA ile sabittir.

name: derleme

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # paths-ignore olumsuzlamayı desteklemez: `paths` + `!` (sonraki kural öncekini geçer). Belgeler yok
    # sayılır, ama docs/sozlesmeler/sema/** derlemenin girdisidir (sim/a3/CMakeLists.txt) ve tetikler.
    paths:
      - '**'
      - '!docs/**'
      - 'docs/sozlesmeler/sema/**'
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: derleme-windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: ${{ matrix.ad }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: Windows x64
            asan: false
          - ad: Windows x64 (ASan)
            asan: true
    defaults:
      run:
        shell: bash
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'

      # Node testleri (sim.a3.*_web, butunleme.a3_*_web) web/node_modules ister; kurulum başarısızsa
      # iş düşer, testler IDA_BAGIMLILIK_ZORUNLU ile atlanamaz. Her iki kolda (ASan dahil) gerekir.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: MSVC geliştirici ortamı (x64)
        shell: pwsh
        run: tools/ci/msvc-ortam.ps1

      - name: Önbellek yolları
        run: |
          t=$(cygpath -m "$RUNNER_TEMP")
          {
            echo "IDA_ARACLAR=$t/ida-araclar"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$t/vcpkg-ikili"
            echo "CPM_SOURCE_CACHE=$t/cpm"
          } >>"$GITHUB_ENV"
          mkdir -p "$t/ida-araclar" "$t/vcpkg-ikili" "$t/cpm"

      # Önbellekler ayrı geri yüklenip ayrı kaydedilir: sonraki bir adım başarısız olsa da
      # kurulan araçlar önbelleğe girer (her CI denemesi kotadan yer).
      - name: Araç önbelleğini geri yükle (Arm GNU 14.3.rel1, cppcheck)
        id: araclar_onbellek
        if: ${{ !matrix.asan }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.IDA_ARACLAR }}
          key: araclar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/arm-gnu-kur.sh', 'tools/ci/cppcheck-kur.sh') }}

      - name: vcpkg ikili önbelleğini geri yükle
        id: vcpkg_onbellek
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay/**') }}

      - name: Arm GNU Toolchain 14.3.rel1
        id: arm
        if: ${{ !matrix.asan }}
        run: tools/ci/arm-gnu-kur.sh "$IDA_ARACLAR"

      - name: cppcheck 2.22.0
        id: cppcheck
        if: ${{ !cancelled() && !matrix.asan }}
        run: tools/ci/cppcheck-kur.sh "$IDA_ARACLAR"

      - name: Araç önbelleğini kaydet
        if: ${{ !cancelled() && !matrix.asan && steps.arm.outcome == 'success' && steps.cppcheck.outcome == 'success' && steps.araclar_onbellek.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.IDA_ARACLAR }}
          key: ${{ steps.araclar_onbellek.outputs.cache-primary-key }}

      - name: clang-tidy 21.1.6 (pip, özet sabit)
        id: clangtidy
        if: ${{ !cancelled() && !matrix.asan }}
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r tools/ci/gereksinimler-analiz.txt
          command -v clang-tidy

      - name: vcpkg hazırlığı (baseline)
        id: vcpkg
        if: ${{ !cancelled() }}
        run: tools/ci/vcpkg-hazirla.sh

      - name: Sürümler
        if: ${{ !cancelled() }}
        run: tools/ci/surumler.sh

      # Kurulum zincirinin sonunda: düşerse Node testi isteyen derleme adımları atlanır (ikincil hata yok).
      - name: Web bağımlılıkları (npm ci)
        id: npm
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm ci

      # Derleme adımları birbirinden bağımsız koşar: biri başarısız olsa da ötekiler sonuç verir.
      - name: host-debug (derleme, birim testi, sözleşme başlıkları, sınır denetimi; MSVC /analyze)
        id: host_debug
        if: ${{ !cancelled() && !matrix.asan && steps.vcpkg.outcome == 'success' && steps.npm.outcome == 'success' }}
        run: |
          cmake --preset host-debug -DIDA_BAGIMLILIK_ZORUNLU=ON -DIDA_MSVC_ANALYZE=ON
          cmake --build --preset host-debug
          ctest --preset host-debug

      - name: vcpkg ikili önbelleğini kaydet
        if: ${{ !cancelled() && !matrix.asan && steps.host_debug.outcome == 'success' && steps.vcpkg_onbellek.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg_onbellek.outputs.cache-primary-key }}

      - name: host-asan (ASan)
        if: ${{ !cancelled() && matrix.asan && steps.vcpkg.outcome == 'success' && steps.npm.outcome == 'success' }}
        run: |
          cmake --preset host-asan -DIDA_BAGIMLILIK_ZORUNLU=ON
          cmake --build --preset host-asan
          ctest --preset host-asan -j 2

      - name: fw-debug (kartsız; GCC -fanalyzer)
        if: ${{ !cancelled() && !matrix.asan && steps.arm.outcome == 'success' }}
        run: |
          cmake --preset fw-debug
          cmake --build --preset fw-debug
          ctest --preset fw-debug

      - name: fw-release (kartsız)
        if: ${{ !cancelled() && !matrix.asan && steps.arm.outcome == 'success' }}
        run: |
          cmake --preset fw-release
          cmake --build --preset fw-release
          ctest --preset fw-release

      - name: Statik analiz (clang-tidy, cppcheck; core/, protocol/ida_link/)
        if: ${{ !cancelled() && !matrix.asan && steps.cppcheck.outcome == 'success' && steps.clangtidy.outcome == 'success' }}
        run: |
          mkdir -p build/rapor
          tools/denetim/statik-analiz.sh build/rapor/statik-analiz.txt

      - name: Statik analiz denetiminin kendi testi (araç hatası 70, karşı örnek kimlikleri)
        if: ${{ !cancelled() && !matrix.asan && steps.cppcheck.outcome == 'success' && steps.clangtidy.outcome == 'success' }}
        run: tools/denetim/test/statik_analiz_test.sh

      - name: Raporları topla
        if: ${{ always() && !matrix.asan }}
        run: tools/ci/rapor-topla.sh build/rapor

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && !matrix.asan }}
        with:
          name: rapor-windows-x64
          path: build/rapor
          retention-days: 7
          if-no-files-found: warn
