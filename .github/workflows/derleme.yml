# Otomatik derleme ve test (W2-depo §5; 09 §2.8).
#
# İçerik (iki işte de aynı): host derleme (uyarı hatadır), birim testi, sözleşme başlıkları
# denetimi, kartsız firmware derlemesi (harita, boyut ve yığın raporu artefakt), bellek
# ayırma denetimi, sanitizer (host-asan), statik analiz. Belge ve depo denetimi ayrı iş
# akışındadır (belge.yml).
#
# Ne zaman hangi iş koşar (kota düzeni; mimar kararı 2026-11-20):
#   - Windows x64: PR açılınca, her yeni gönderimde ve yeniden açılınca (opened,
#     synchronize, reopened) ve workflow_dispatch ile. Etiket eklenmesi (labeled) Windows
#     işini koşturmaz. Gerekçe: yerelde doğrulanamayan tek platform.
#   - macOS arm64: yalnız PR'a `ci-mac` etiketi EKLENDİĞİ anda (labeled olayı, etiket adı
#     denetlenir) ve workflow_dispatch ile. Etiket PR'da dururken yapılan yeni gönderim
#     macOS işini tetiklemez; yeniden koşturmak için etiket kaldırılıp yeniden eklenir.
#     Gerekçe: her iş Mac'te yerelde derlenip test edilir; macOS dakikası Windows'unkinin
#     altı katıdır. Kayıt agent'ı birleştirmeden önce etiketi bir kez ekler.
#   - workflow_dispatch yalnız bu dosya varsayılan dalda (main) bulunduktan sonra
#     kullanılabilir; bu dosyayı getiren ilk PR'da macOS işinin tek yolu `ci-mac` etiketidir.
#   - Yalnız belge değiştiren PR bu akışı tetiklemez (paths-ignore; etiket olayı dahil).
#
# Eşzamanlılık iş düzeyindedir ve olay türüne göre ayrılır: etiketle başlayan macOS koşusu
# süren Windows koşusunu iptal etmez; aynı PR'a yeni gönderim yalnız eski Windows koşusunu,
# etiketin yeniden eklenmesi yalnız eski macOS koşusunu iptal eder.
#
# Kota: depo özeldir ve GitHub Free planındadır (aylık 12 USD dahil kullanım; dakika ücreti
# Linux 0,006, Windows 0,010, macOS 0,062 USD). İşletim sistemi başına tek iş vardır (iş
# başına dakika yukarı yuvarlanır) ve araçlar önbelleklenir. Koşucu etiketleri açık
# sürümlüdür; eylemler commit SHA ile sabittir.

name: derleme

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'ci-mac')
    concurrency:
      group: derleme-macos-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && 'etiket' || 'diger' }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'

      - name: Önbellek yolları
        run: |
          t=$RUNNER_TEMP
          {
            echo "IDA_ARACLAR=$t/ida-araclar"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$t/vcpkg-ikili"
            echo "CPM_SOURCE_CACHE=$t/cpm"
          } >>"$GITHUB_ENV"
          mkdir -p "$t/ida-araclar" "$t/vcpkg-ikili" "$t/cpm"

      # Önbellekler ayrı geri yüklenip ayrı kaydedilir: sonraki bir adım başarısız olsa da
      # kurulan araçlar önbelleğe girer (her CI denemesi kotadan yer).
      - name: Araç önbelleğini geri yükle (Arm GNU 14.3.rel1, cppcheck)
        id: araclar_onbellek
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.IDA_ARACLAR }}
          key: araclar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/arm-gnu-kur.sh', 'tools/ci/cppcheck-kur.sh') }}

      - name: vcpkg ikili önbelleğini geri yükle
        id: vcpkg_onbellek
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}

      - name: Arm GNU Toolchain 14.3.rel1
        id: arm
        run: tools/ci/arm-gnu-kur.sh "$IDA_ARACLAR"

      - name: cppcheck 2.22.0
        id: cppcheck
        if: ${{ !cancelled() }}
        run: tools/ci/cppcheck-kur.sh "$IDA_ARACLAR"

      - name: Araç önbelleğini kaydet
        if: ${{ !cancelled() && steps.arm.outcome == 'success' && steps.cppcheck.outcome == 'success' && steps.araclar_onbellek.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.IDA_ARACLAR }}
          key: ${{ steps.araclar_onbellek.outputs.cache-primary-key }}

      - name: clang-tidy 21.1.6 (pip, özet sabit)
        id: clangtidy
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r tools/ci/gereksinimler-analiz.txt
          command -v clang-tidy

      - name: vcpkg hazırlığı (baseline)
        id: vcpkg
        if: ${{ !cancelled() }}
        run: tools/ci/vcpkg-hazirla.sh

      - name: Sürümler
        if: ${{ !cancelled() }}
        run: tools/ci/surumler.sh

      # Derleme adımları birbirinden bağımsız koşar: biri başarısız olsa da ötekiler sonuç verir.
      - name: host-debug (derleme, birim testi, sözleşme başlıkları, bellek ve sınır denetimi)
        id: host_debug
        if: ${{ !cancelled() && steps.vcpkg.outcome == 'success' }}
        run: |
          cmake --preset host-debug -DIDA_BAGIMLILIK_ZORUNLU=ON
          cmake --build --preset host-debug
          ctest --preset host-debug

      - name: vcpkg ikili önbelleğini kaydet
        if: ${{ !cancelled() && steps.host_debug.outcome == 'success' && steps.vcpkg_onbellek.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg_onbellek.outputs.cache-primary-key }}

      - name: host-asan (ASan + UBSan)
        if: ${{ !cancelled() && steps.vcpkg.outcome == 'success' }}
        run: |
          cmake --preset host-asan -DIDA_BAGIMLILIK_ZORUNLU=ON
          cmake --build --preset host-asan
          ctest --preset host-asan

      - name: fw-debug (kartsız; GCC -fanalyzer)
        if: ${{ !cancelled() && steps.arm.outcome == 'success' }}
        run: |
          cmake --preset fw-debug
          cmake --build --preset fw-debug
          ctest --preset fw-debug

      - name: fw-release (kartsız)
        if: ${{ !cancelled() && steps.arm.outcome == 'success' }}
        run: |
          cmake --preset fw-release
          cmake --build --preset fw-release
          ctest --preset fw-release

      - name: Statik analiz (clang-tidy, cppcheck; core/, protocol/ida_link/)
        if: ${{ !cancelled() && steps.cppcheck.outcome == 'success' && steps.clangtidy.outcome == 'success' }}
        run: |
          mkdir -p build/rapor
          tools/denetim/statik-analiz.sh build/rapor/statik-analiz.txt

      - name: Bellek ayırma betiğinin kendi testi
        if: ${{ !cancelled() && steps.arm.outcome == 'success' }}
        run: PATH="$ARM_GCC_BIN:$PATH" tools/denetim/test/test.sh

      - name: Raporları topla
        if: always()
        run: tools/ci/rapor-topla.sh build/rapor

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rapor-macos-arm64
          path: build/rapor
          retention-days: 7
          if-no-files-found: warn

  windows:
    name: Windows x64
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled')
    concurrency:
      group: derleme-windows-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && 'etiket' || 'gonderim' }}
      cancel-in-progress: true
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'

      - name: MSVC geliştirici ortamı (x64)
        shell: pwsh
        run: tools/ci/msvc-ortam.ps1

      - name: Önbellek yolları
        run: |
          t=$(cygpath -m "$RUNNER_TEMP")
          {
            echo "IDA_ARACLAR=$t/ida-araclar"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$t/vcpkg-ikili"
            echo "CPM_SOURCE_CACHE=$t/cpm"
          } >>"$GITHUB_ENV"
          mkdir -p "$t/ida-araclar" "$t/vcpkg-ikili" "$t/cpm"

      # Önbellekler ayrı geri yüklenip ayrı kaydedilir: sonraki bir adım başarısız olsa da
      # kurulan araçlar önbelleğe girer (her CI denemesi kotadan yer).
      - name: Araç önbelleğini geri yükle (Arm GNU 14.3.rel1, cppcheck)
        id: araclar_onbellek
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.IDA_ARACLAR }}
          key: araclar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/arm-gnu-kur.sh', 'tools/ci/cppcheck-kur.sh') }}

      - name: vcpkg ikili önbelleğini geri yükle
        id: vcpkg_onbellek
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}

      - name: Arm GNU Toolchain 14.3.rel1
        id: arm
        run: tools/ci/arm-gnu-kur.sh "$IDA_ARACLAR"

      - name: cppcheck 2.22.0
        id: cppcheck
        if: ${{ !cancelled() }}
        run: tools/ci/cppcheck-kur.sh "$IDA_ARACLAR"

      - name: Araç önbelleğini kaydet
        if: ${{ !cancelled() && steps.arm.outcome == 'success' && steps.cppcheck.outcome == 'success' && steps.araclar_onbellek.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.IDA_ARACLAR }}
          key: ${{ steps.araclar_onbellek.outputs.cache-primary-key }}

      - name: clang-tidy 21.1.6 (pip, özet sabit)
        id: clangtidy
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r tools/ci/gereksinimler-analiz.txt
          command -v clang-tidy

      - name: vcpkg hazırlığı (baseline)
        id: vcpkg
        if: ${{ !cancelled() }}
        run: tools/ci/vcpkg-hazirla.sh

      - name: Sürümler
        if: ${{ !cancelled() }}
        run: tools/ci/surumler.sh

      # Derleme adımları birbirinden bağımsız koşar: biri başarısız olsa da ötekiler sonuç verir.
      - name: host-debug (derleme, birim testi, sözleşme başlıkları, sınır denetimi; MSVC /analyze)
        id: host_debug
        if: ${{ !cancelled() && steps.vcpkg.outcome == 'success' }}
        run: |
          cmake --preset host-debug -DIDA_BAGIMLILIK_ZORUNLU=ON -DIDA_MSVC_ANALYZE=ON
          cmake --build --preset host-debug
          ctest --preset host-debug

      - name: vcpkg ikili önbelleğini kaydet
        if: ${{ !cancelled() && steps.host_debug.outcome == 'success' && steps.vcpkg_onbellek.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg_onbellek.outputs.cache-primary-key }}

      - name: host-asan (ASan)
        if: ${{ !cancelled() && steps.vcpkg.outcome == 'success' }}
        run: |
          cmake --preset host-asan -DIDA_BAGIMLILIK_ZORUNLU=ON
          cmake --build --preset host-asan
          ctest --preset host-asan

      - name: fw-debug (kartsız; GCC -fanalyzer)
        if: ${{ !cancelled() && steps.arm.outcome == 'success' }}
        run: |
          cmake --preset fw-debug
          cmake --build --preset fw-debug
          ctest --preset fw-debug

      - name: fw-release (kartsız)
        if: ${{ !cancelled() && steps.arm.outcome == 'success' }}
        run: |
          cmake --preset fw-release
          cmake --build --preset fw-release
          ctest --preset fw-release

      - name: Statik analiz (clang-tidy, cppcheck; core/, protocol/ida_link/)
        if: ${{ !cancelled() && steps.cppcheck.outcome == 'success' && steps.clangtidy.outcome == 'success' }}
        run: |
          mkdir -p build/rapor
          tools/denetim/statik-analiz.sh build/rapor/statik-analiz.txt

      - name: Raporları topla
        if: always()
        run: tools/ci/rapor-topla.sh build/rapor

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rapor-windows-x64
          path: build/rapor
          retention-days: 7
          if-no-files-found: warn
