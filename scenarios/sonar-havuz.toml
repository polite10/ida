# Sonar örnek senaryosu (W4-bagla-sonar, W4-sonar-sahne): kapalı havuzda batık başlayan İDA-0,
# Ping1D ve Ping360 açık (araç dosyasındaki ping1d0 ve ping360_0), sonar arızaları zaman çizelgesinde.
# Sözleşme: docs/sozlesmeler/A5-senaryo.md (1.0). Birimler SI; açılar radyan; süreler tamsayı ns.
#
# Çalıştırma: ida_sim --senaryo scenarios/sonar-havuz.toml --sonar [--a3-port 0] [--sonar-csv <yol>]
# (`--sonar` olmadan sonar kurulmaz; sim/sunucu/BENIOKU.md "Sonar").
#
# Sahne (sim/senaryo/BENIOKU.md "Sonar kurulumu"): A7 kümesi `havuz` (assets/havuz; üretici
# viz/arac/model-uret/havuz.py). Sonar havuz_ornek varlığının taban ve dört duvar ağlarını izler
# (A7-K27: akustik ağ yok, çarpışma kaynak ağları); havuz 25 m × 12,5 m, taban 3 m, REF havuz
# ortasında su yüzeyinde (araç başlangıçta havuz ortasında). Uygunluk örneği `ornek`in ikili
# dosyaları yoktur; onu gösteren senaryolar (z1.toml, ornek-havuz.toml) `--sonar` ile A7 hatasıyla
# reddedilir. Araç silahlandırılmaz: hafif pozitif yüzerlikle (İDA-0, 04 §2.6) yavaşça yükselir;
# Ping1D irtifası zamanla büyür.

[meta]
sema_surumu = "1.0"
tur = "senaryo"
ad = "sonar-havuz"
aciklama = "Sonar: kapali havuzda batik baslayan arac; Ping1D ve Ping360 acik, sonar arizalari."

[arac]
dosya = "ida0.toml"

# Kapalı havuzda uydu görülmez: GNSS kapalı (ornek-havuz.toml ile aynı). Kamera kapalı (A5-K80).
[arac.sensorler.gnss0]
etkin = false

[arac.sensorler.kamera0]
etkin = false

[varliklar]
kume = "havuz"
kume_surumu = 1
manifest_ozeti = "39b94a462c88ff1ac2a940e12c443c93d48fbafc4148d2af7cfce7a222cdda18"

[calistirma]
kip = "sil"
sure_ns = 30_000_000_000      # 30 s
sil_azami_hiz = true

[ortam]
tur = "havuz"
sahne = "havuz_ornek"
derinlik = 3.0
manyetik_alan = [25.6e-6, 2.7e-6, 40.3e-6]

[ortam.orijin]
enlem = 0.7155849933176751
boylam = 0.5061454830783556
yukseklik = 0.0

[ortam.su]
sicaklik_c = 20.0             # ses hızı verilmez: tatlı suda UNESCO/Chen–Millero (W4-K1)

[rastgelelik]
ana_tohum = 7

[kalite]
kamera = "kapali"
sonar = "sade"

[baslangic]
konum = [0.0, 0.0, 2.0]       # m; Ping360 başı (montaj z −0,20 m) suyun altında
yonelim = [1.0, 0.0, 0.0, 0.0]
yuklu_tupler = ["f1", "f2"]

# Sonar arızaları (A5 Tablo 3.10-A; sonar modelinin desteklediği gövdeli türler).
[[olaylar]]
kimlik = "p1d_kayip"
sinif = "sensor"
zaman_ns = 10_000_000_000
sure_ns = 1_000_000_000
tur = "kayip"
hedef = "ping1d0"

[[olaylar]]
kimlik = "p1d_donma"
sinif = "sensor"
zaman_ns = 15_000_000_000
sure_ns = 1_000_000_000
tur = "donma"
hedef = "ping1d0"

[[olaylar]]
kimlik = "p360_bildirim"
sinif = "sensor"
zaman_ns = 20_000_000_000
sure_ns = 2_000_000_000
tur = "kendini_bildiren"
hedef = "ping360_0"
