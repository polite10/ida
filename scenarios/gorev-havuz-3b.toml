# 3B eşi (W5-bagla-a2): gorev-havuz.toml ile aynıdır; yalnız varlık kümesi `havuz` (assets/havuz; ikili
# dosyaları vardır) ve ona bağlı manifest özeti ile [meta] ad/aciklama farklıdır. Neden ayrı dosya:
# gorev-havuz.toml `ornek` kümesini gösterir, onun .glb dosyaları yoktur ve görselleştirici sahneyi
# kuramaz (EKSIK_VARLIK). Görselleştirici ile gösterim:
#   viz/calistir.sh --sim scenarios/gorev-havuz-3b.toml
# Görev yürütücüsünün uçtan uca SIL denemesi (W5-gorev-yurutucu kabul 6): kapalı havuzda yüzeyde
# iki yol noktası → bulunduğu yerde dalış → su altında bir yol noktası → yüzeye çıkış.
# Sözleşme: docs/sozlesmeler/A5-senaryo.md (1.0). Birimler SI; açılar radyan; süreler tamsayı ns;
# görev öğeleri A1 Tablo 3.6a'nın birimlerini taşır (A5-K11, K55).
#
# Kurulum z1.toml'unkidir (havuz, GNSS etkin, aynı parametre bloğu). Kapalı havuzda GNSS'in açık
# olması bu denemenin varsayımıdır: yatay konum kestirimi en az bir kez GNSS'ten kurulmadan geçerli
# olmaz ve AUTO yatay konum ister (W5-K25 (3), bilinen sınır). Görev A5'in görev yüklemesiyle
# gelir (A5-K57); AUTO'ya giriş yüklü görevi başlatır (A5 1.0'ın gcs_komutu'nda MISSION_CTL yok).
# Havuz 25 m × 12,5 m, orijin ortada (assets/ornek/manifest.json havuz_ornek); yol noktaları içeride.

[meta]
sema_surumu = "1.0"
tur = "senaryo"
ad = "gorev-havuz-3b"
aciklama = "3B esi (Gorev yurutucusu: yuzeyde iki yol noktasi, dalis, su altinda yol noktasi, yuzeye cikis; havuz kumesi)."

[arac]
dosya = "ida0.toml"

[arac.sensorler.kamera0]
etkin = false

[varliklar]
kume = "havuz"
kume_surumu = 1
manifest_ozeti = "39b94a462c88ff1ac2a940e12c443c93d48fbafc4148d2af7cfce7a222cdda18"

[calistirma]
kip = "sil"
sure_ns = 240_000_000_000     # 240 s
sil_azami_hiz = true

[otopilot]
parametreler = [
  { kimlik = 534, tip = "f32", deger = 9.82 },                  # YER_G = ortam.yercekimi
  { kimlik = 532, tip = "f32", deger = 0.04471300408133902 },   # BARO_KAL_D = başlangıç O_b derinliği
]

[ortam]
tur = "havuz"
sahne = "havuz_ornek"
derinlik = 3.0
manyetik_alan = [25.6e-6, 2.7e-6, 40.3e-6]

[ortam.orijin]
enlem = 0.7155849933176751
boylam = 0.5061454830783556
yukseklik = 0.0

[ortam.su]
sicaklik_c = 20.0
ses_hizi = 1482.3

# Görünüm (A5-K101: görüntü gerçekçiliği için senaryo yazarı verir; değerler ölçüm değil, yer tutucudur —
# W5-viz-gorsel): berrak, hafif turkuaz havuz suyu. Verilmezse sim 0 yazar ("berrak su", ışıksız sahne) ve
# görselleştirici kendi görsel varsayılanına döner. Güneş yönü ve ışınımı KE varsayılanıyla kalır.
[ortam.su_optigi]
beta_d_m = [0.30, 0.055, 0.04]
beta_b_m = [0.11, 0.065, 0.055]
b_sonsuz_rgb_dogrusal = [0.02, 0.20, 0.26]

[ortam.isik]
ortam_isigi_rgb_dogrusal = [0.30, 0.36, 0.42]

[rastgelelik]
ana_tohum = 1

[kalite]
kamera = "kapali"

[baslangic]
konum = [0.0, 0.0, 0.04471300408133902]
yonelim = [1.0, 0.0, 0.0, 0.0]
yuklu_tupler = ["f1", "f2"]

[gorev]
yukleme_zamani_ns = 1_000_000_000

[[gorev.ogeler]]                # 0: yüzeyde kuzeye 6 m
item_type = "WAYPOINT"
frame = "LOCAL"
p = [0.5, 0.4, 0.0, 0.0]        # kabul yarıçapı 0,5 m; seyir hızı 0,4 m/s
lat_e7 = 0
lon_e7 = 0
north_m = 6.0
east_m = 0.0
depth = 0.0

[[gorev.ogeler]]                # 1: yüzeyde doğuya 4 m (köşe)
item_type = "WAYPOINT"
frame = "LOCAL"
p = [0.5, 0.4, 0.0, 0.0]
lat_e7 = 0
lon_e7 = 0
north_m = 6.0
east_m = 4.0
depth = 0.0

[[gorev.ogeler]]                # 2: bulunduğu yerde 1,5 m'ye dalış
item_type = "DIVE_TO"
frame = "NONE"
p = [0.2, 0.2, 0.0, 0.0]        # dikey hız 0,2 m/s; derinlik toleransı 0,2 m
lat_e7 = 0
lon_e7 = 0
north_m = 0.0
east_m = 0.0
depth = 1.5

[[gorev.ogeler]]                # 3: su altında güneye 6 m
item_type = "WAYPOINT"
frame = "LOCAL"
p = [0.5, 0.3, 0.0, 0.0]
lat_e7 = 0
lon_e7 = 0
north_m = 0.0
east_m = 4.0
depth = 1.5

[[gorev.ogeler]]                # 4: yüzeye çıkış
item_type = "SURFACE"
frame = "NONE"
p = [0.2, 0.0, 0.0, 0.0]        # çıkış hızı 0,2 m/s
lat_e7 = 0
lon_e7 = 0
north_m = 0.0
east_m = 0.0
depth = 0.0

[[olaylar]]
kimlik = "arm"
sinif = "gcs_komutu"
zaman_ns = 10_000_000_000
komut = "ARM"

[[olaylar]]
kimlik = "auto"
sinif = "gcs_komutu"
zaman_ns = 10_500_000_000
komut = "SET_MODE"
kip = "AUTO"

[[olaylar]]
kimlik = "disarm"
sinif = "gcs_komutu"
zaman_ns = 230_000_000_000
komut = "DISARM"
